name: Build ImmortalWrt for R66S (ImageBuilder)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-pip
        sudo timedatectl set-timezone "Asia/Hong_Kong"

    - name: Download & Extract Official ImmortalWrt ImageBuilder
      run: |
        # 使用官方 ImmortalWrt 23.05 rockchip/armv8 穩定版 ImageBuilder
        IB_URL="https://downloads.immortalwrt.org/releases/23.05.4/targets/rockchip/armv8/immortalwrt-imagebuilder-23.05.4-rockchip-armv8.Linux-x86_64.tar.xz"
        wget -qO- $IB_URL | tar -xJ
        mv immortalwrt-imagebuilder-* openwrt_ib

    - name: Customize Configurations & Overheat Optimization
      run: |
        cd openwrt_ib
        
        # 建立開機預設設定檔 (uci-defaults)
        mkdir -p files/etc/uci-defaults
        cat << 'EOF' > files/etc/uci-defaults/99-r66s-optimize
        # 預設 IP 設為 192.168.1.1
        uci set network.lan.ipaddr='192.168.1.1'
        uci commit network

        # CPU 防過熱優化：將頻率調節器設定為 schedutil，兼顧效能與發熱控制
        if [ -d /sys/devices/system/cpu/cpu0/cpufreq ]; then
            echo "schedutil" > /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
        fi
        if [ -d /sys/devices/system/cpu/cpu4/cpufreq ]; then
            echo "schedutil" > /sys/devices/system/cpu/cpu4/cpufreq/scaling_governor
        fi
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-r66s-optimize

    - name: Build Firmware using ImageBuilder
      run: |
        cd openwrt_ib
        
        # 自動搜尋並鎖定 R66S 的正確 Profile 代號
        PROFILE=$(make info | grep -oE 'fastrhino[^[:space:]]*r66s' | head -n 1)
        if [ -z "$PROFILE" ]; then
          PROFILE="fastrhino_r66s"
        fi
        echo "Using Target Profile: $PROFILE"
        
        # 開始打包韌體（加入繁體中文語系與預設設定檔案）
        make image PROFILE="$PROFILE" PACKAGES="luci-i18n-base-zh-tw" FILES="files"

    - name: Organize Firmware Output
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt_ib/bin/targets/rockchip/armv8/
