name: Build iStoreOS for R66S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune -a --force
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev liblzo2-dev \
          libncurses5-dev libpam0g-dev libseccomp-dev libssl-dev libtool lrzsz mkisofs nano ninja-build \
          pcre2-utils python3 python3-dev python3-pip qemu-utils rsync scons squashfs-tools subversion \
          swig texinfo uglifyjs upx-ucl uuid-dev xsltproc zlib1g-dev zstd
        sudo timedatectl set-timezone "Asia/Hong_Kong"

    - name: Clone iStoreOS Source Code
      run: |
        git clone --depth 1 -b istoreos-22.03 https://github.com/istoreos/istoreos.git openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Customize Configuration & Overheat Optimization
      run: |
        cd openwrt
        
        # 1. 指定 FastRhino R66S 機型
        echo "CONFIG_TARGET_rockchip=y" > .config
        echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
        echo "CONFIG_TARGET_ROCKCHIP_ARMV8_DEVICE_fastrhino_r66s=y" >> .config

        # 2. 繁體中文與基礎套件
        echo "CONFIG_PACKAGE_luci-i18n-base-zh-tw=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-istore=y" >> .config

        # 3. 過熱優化與預設 192.168.1.1 設定
        mkdir -p package/base-files/files/etc/uci-defaults
        cat << 'EOF' > package/base-files/files/etc/uci-defaults/99-r66s-optimize
        # 預設 IP
        uci set network.lan.ipaddr='192.168.1.1'
        uci commit network

        # CPU 防過熱調速器設為 schedutil
        if [ -d /sys/devices/system/cpu/cpu0/cpufreq ]; then
            echo "schedutil" > /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
        fi
        if [ -d /sys/devices/system/cpu/cpu4/cpufreq ]; then
            echo "schedutil" > /sys/devices/system/cpu/cpu4/cpufreq/scaling_governor
        fi
        exit 0
        EOF
        chmod +x package/base-files/files/etc/uci-defaults/99-r66s-optimize

        # 生成預設配置並補全依賴
        make defconfig

    - name: Download Source Packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Single-Thread Safety Compile
      run: |
        cd openwrt
        # 使用 -j$(nproc) 如果失敗自動退回 -j1 V=s 輸出詳細 Log
        make -j$(nproc) || make -j1 V=s

    - name: Organize Firmware Output
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt/bin/targets/rockchip/armv8/
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_ENV

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: istoreos-r66s-firmware
        path: ${{ env.FIRMWARE }}
