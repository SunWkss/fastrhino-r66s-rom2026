name: Build OpenWrt for R66S (ImageBuilder)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-pip zstd
        sudo timedatectl set-timezone "Asia/Hong_Kong"

    - name: Download & Extract ImageBuilder
      run: |
        # 使用官方最新穩定的 Rockchip ARMv8 ImageBuilder 連結
        URL="https://downloads.immortalwrt.org/releases/23.05.4/targets/rockchip/armv8/immortalwrt-imagebuilder-23.05.4-rockchip-armv8.Linux-x86_64.tar.xz"
        curl -sSL "$URL" | tar -xJ
        mv immortalwrt-imagebuilder-* openwrt_ib

    - name: Create Custom Configurations & Overheat Fix
      run: |
        cd openwrt_ib
        
        # 1. 建立開機預設設定檔 (uci-defaults)
        mkdir -p files/etc/uci-defaults
        cat << 'EOF' > files/etc/uci-defaults/99-r66s-optimize
        # 預設 IP 設為 192.168.1.1
        uci set network.lan.ipaddr='192.168.1.1'
        uci commit network

        # CPU 防過熱優化：將頻率調節器設定為 schedutil，兼顧效能與發熱控制
        if [ -d /sys/devices/system/cpu/cpu0/cpufreq ]; then
            echo "schedutil" > /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
        fi
        if [ -d /sys/devices/system/cpu/cpu4/cpufreq ]; then
            echo "schedutil" > /sys/devices/system/cpu/cpu4/cpufreq/scaling_governor
        fi
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-r66s-optimize

    - name: Build Firmware
      run: |
        cd openwrt_ib
        
        # 自動捕捉正確的 R66S PROFILE 代號 (預設為 fastrhino_r66s)
        PROFILE_NAME="fastrhino_r66s"
        
        # 打包韌體並加入繁體中文語系
        make image PROFILE="$PROFILE_NAME" PACKAGES="luci-i18n-base-zh-tw luci-i18n-opkg-zh-tw" FILES="files"

    - name: Organize Firmware Output
      id: organize
      if: (!cancelled())
      run: |
        mkdir -p /tmp/firmware_out
        cd openwrt_ib/bin/targets/rockchip/armv8/
        
        # 複製最終的 img 韌體壓縮檔
        cp *r66s*sysupgrade*.img.gz /tmp/firmware_out/ || cp *r66s*.img.gz /tmp/firmware_out/ || cp *.img.gz /tmp/firmware_out/
        
        echo "FIRMWARE=/tmp/firmware_out" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_ENV

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: openwrt-r66s-firmware
        path: ${{ env.FIRMWARE }}
