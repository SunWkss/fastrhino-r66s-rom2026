name: Build OpenWrt for R66S

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release new firmware'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker rmi $(docker image ls -q)
        sudo apt-get update
        sudo apt-get install -y build-internal subversion libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-pip xz-utils bc
        sudo apt-get clean

    - name: Clone Source Code
      run: |
        git clone -b openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git openwrt
        cd openwrt
        # 這裡可以加入額外的feed，例如iStore
        echo "src-git istore https://github.com/linkease/istore;main" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Customize Configuration & Settings
      run: |
        cd openwrt
        
        # 更改預設 IP 為 192.168.1.1
        sed -i 's/192.168.1.1/192.168.1.1/g' package/base-files/files/bin/config_generate

        # 預設密碼設為 password (留空或設定密碼)
        # 這裡使用預設空密碼或指定密碼，immortalwrt 預設通常無密碼或 password

        # 寫入針對 RK3568 R66S 的配置
        cat << 'EOF' > .config
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv8=y
        CONFIG_TARGET_rockchip_armv8_device_fastrhino_r66s=y
        
        # 語系與主題
        CONFIG_PACKAGE_luci-theme-istore=y
        CONFIG_PACKAGE_luci-i18n-base-zh-tw=y
        CONFIG_PACKAGE_luci-i18n-base-en=y
        
        # 散熱與系統優化選項
        CONFIG_DEFAULT_KERNEL_GA=y
        EOF

        make defconfig

    - name: Download Package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build Firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: OpenWrt-R66S-Firmware
        path: openwrt/bin/targets/*/*/*
